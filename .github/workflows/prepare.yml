name: Prepare Portfolio Repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'Amar-Karale/medical-b2b-erp-devops'
    steps:
      - name: Checkout portfolio repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import reference project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reference-project
          git clone --depth 1 https://github.com/AnupDudhe/edublitz-b2b-medical-erp.git /tmp/reference-project
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/reference-project/ ./

      - name: Remove unsafe/non-essential files
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/EKS_ALB_Setup_Runbook.docx
          rm -f k8s/secrets/app-secrets.yaml

      - name: Harden application configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in [
              Path('user-service/src/main/resources/application.yml'),
              Path('product-service/src/main/resources/application.yml'),
              Path('order-service/src/main/resources/application.yml'),
          ]:
              text = path.read_text()
              text = text.replace(
                  '${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}',
                  '${JWT_SECRET}'
              )
              path.write_text(text)

          for path in [
              Path('terraform/env/dev/main.tf'),
              Path('terraform/env/prod/main.tf'),
          ]:
              text = path.read_text()
              text = text.replace('kubernetes_version    = "1.30"', 'kubernetes_version    = "1.34"')
              text = text.replace('kubernetes_version  = "1.30"', 'kubernetes_version  = "1.34"')
              text = text.replace('region         = "us-east-1"', 'region         = "us-west-1"')
              text = text.replace('dynamodb_table = "med-erp-terraform-locks"', 'use_lockfile   = true')
              path.write_text(text)

          for path in [
              Path('terraform/env/dev/variables.tf'),
              Path('terraform/env/prod/variables.tf'),
          ]:
              if path.exists():
                  text = path.read_text().replace('default = "us-east-1"', 'default = "us-west-1"')
                  path.write_text(text)

          for path in [
              Path('jenkins/Jenkinsfile.backend'),
              Path('jenkins/Jenkinsfile.frontend'),
              Path('jenkins/Jenkinsfile.infra'),
          ]:
              text = path.read_text().replace("AWS_REGION     = 'us-east-1'", "AWS_REGION     = 'us-west-1'")
              text = text.replace("AWS_REGION = 'us-east-1'", "AWS_REGION = 'us-west-1'")
              path.write_text(text)
          PY

      - name: Fix frontend reproducible install
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/Dockerfile')
          text = p.read_text().replace('RUN npm ci --prefer-offline', 'RUN npm install --no-audit --no-fund')
          p.write_text(text)
          PY
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi

      - name: Add safe Kubernetes secret template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p k8s/secrets scripts
          cat > k8s/secrets/app-secrets.example.yaml <<'YAML'
          apiVersion: v1
          kind: Secret
          metadata:
            name: app-secrets
            namespace: med-erp
          type: Opaque
          stringData:
            MONGODB_URI_USER: "mongodb+srv://<username>:<password>@<cluster>/<database>?retryWrites=true&w=majority"
            MONGODB_URI_PRODUCT: "mongodb+srv://<username>:<password>@<cluster>/<database>?retryWrites=true&w=majority"
            MONGODB_URI_ORDER: "mongodb+srv://<username>:<password>@<cluster>/<database>?retryWrites=true&w=majority"
            JWT_SECRET: "<generate-a-long-random-secret>"
          YAML
          cat > k8s/secrets/README.md <<'MD'
          # Kubernetes secrets

          `app-secrets.yaml` is intentionally not stored in Git.

          For a real deployment, create the secret from your protected environment:

          ```bash
          kubectl -n med-erp create secret generic app-secrets \\
            --from-literal=MONGODB_URI_USER="$MONGODB_URI_USER" \\
            --from-literal=MONGODB_URI_PRODUCT="$MONGODB_URI_PRODUCT" \\
            --from-literal=MONGODB_URI_ORDER="$MONGODB_URI_ORDER" \\
            --from-literal=JWT_SECRET="$JWT_SECRET" \\
            --dry-run=client -o yaml | kubectl apply -f -
          ```

          Do not paste credentials into Git, Jenkinsfiles, Dockerfiles, or Kubernetes manifests.
          MD

      - name: Add repository hygiene files
        shell: bash
        run: |
          set -euo pipefail
          cat > .gitignore <<'EOF_GITIGNORE'
          # Secrets / environment files
          .env
          .env.*
          !.env.example
          *.pem
          *.key
          *.crt
          k8s/secrets/app-secrets.yaml

          # Terraform
          .terraform/
          *.tfstate
          *.tfstate.*
          tfplan
          *.tfplan
          crash.log
          crash.*.log

          # Java / Maven
          **/target/

          # Node / frontend
          **/node_modules/
          frontend/dist/
          npm-debug.log*
          yarn-debug.log*
          yarn-error.log*
          pnpm-debug.log*

          # IDE / OS
          .idea/
          .vscode/
          *.iml
          .DS_Store
          Thumbs.db

          # Jenkins / local tooling
          workspace/
          .scannerwork/
          EOF_GITIGNORE

          cat > SECURITY.md <<'EOF_SECURITY'
          # Security policy

          This repository is a DevOps portfolio project. Never commit AWS credentials, MongoDB passwords, JWT secrets, kubeconfigs, private keys, or Terraform state.

          Runtime secrets should be supplied through protected Jenkins credentials, AWS IAM roles, Kubernetes Secrets/External Secrets, or another dedicated secret manager.
          EOF_SECURITY

          cat > ATTRIBUTION.md <<'EOF_ATTRIBUTION'
          # Attribution

          This portfolio repository is an adapted DevOps implementation based on the publicly accessible reference project:

          `https://github.com/AnupDudhe/edublitz-b2b-medical-erp`

          The original application structure and domain concepts are retained where useful. This repository adds portfolio-focused infrastructure hygiene, AWS `us-west-1` alignment, secret-safe configuration, CI/CD hardening, documentation, and deployment conventions.

          This attribution does not imply that the original project was authored by the repository owner.
          EOF_ATTRIBUTION

      - name: Replace portfolio README
        shell: bash
        run: |
          set -euo pipefail
          cat > README.md <<'EOF_README'
          # Medical B2B ERP — DevOps Portfolio Project

          A cloud-native Medical B2B ERP platform implemented as a microservices application and prepared as a hands-on DevOps portfolio project.

          > **Attribution:** This repository is an adapted DevOps implementation based on the publicly accessible EduBlitz Medical B2B ERP reference project. See [ATTRIBUTION.md](ATTRIBUTION.md).

          ## Architecture

          ```text
                                      Internet
                                         |
                                  +------v------+
                                  | CloudFront  |
                                  | React/Vite  |
                                  +------+------+
                                         |
                                  +------v------+
                                  | AWS ALB /   |
                                  | EKS Ingress |
                                  +------+------+
                                         |
                     +-------------------+-------------------+
                     |                   |                   |
               +-----v-----+       +-----v------+      +-----v-----+
               | user      |       | product    |      | order     |
               | service   |       | service    |      | service   |
               | :8081     |       | :8082      |      | :8083     |
               +-----+-----+       +-----+------+      +-----+-----+
                     |                   |                   |
                     +-------------------+-------------------+
                                         |
                                  +------v------+
                                  | MongoDB     |
                                  | Atlas       |
                                  +-------------+

          CI/CD: Jenkins -> Maven tests -> Docker -> Trivy -> ECR -> EKS
          IaC: Terraform -> VPC -> EKS -> ECR -> S3/CloudFront -> Route53
          ```

          ## Technology stack

          - **AWS:** EKS, VPC, ALB, ECR, S3, CloudFront, Route53, IAM
          - **Infrastructure as Code:** Terraform modules
          - **CI/CD:** Jenkins
          - **Security:** Trivy image scanning, Kubernetes Secrets, IAM roles
          - **Containers:** Docker
          - **Orchestration:** Kubernetes / Amazon EKS
          - **Backend:** Java 17, Spring Boot, Maven
          - **Frontend:** React 18, Vite, TailwindCSS
          - **Database:** MongoDB Atlas
          - **API:** REST + Swagger/OpenAPI

          ## Microservices

          | Service | Port | Responsibility |
          |---|---:|---|
          | `user-service` | 8081 | Authentication, JWT, RBAC, organizations |
          | `product-service` | 8082 | Product catalog and inventory |
          | `order-service` | 8083 | Orders, billing simulation and order history |

          ## DevOps implementation

          1. Modular Terraform provisions the AWS networking and EKS foundation.
          2. Docker images package the three Spring Boot services and frontend.
          3. Jenkins builds and tests the services.
          4. Trivy scans container images for HIGH/CRITICAL vulnerabilities.
          5. Images are pushed to Amazon ECR.
          6. Kubernetes manifests deploy the services to EKS with rolling updates and health probes.
          7. MongoDB Atlas provides the managed database layer.
          8. CloudFront/S3 can serve the frontend, while Route53 manages DNS when a real domain is supplied.

          ## AWS region

          The primary deployment region for this portfolio setup is **US West (N. California) — `us-west-1`**.

          CloudFront is global. If custom CloudFront HTTPS domains are used, the ACM certificate must be in `us-east-1`, which is an AWS CloudFront requirement.

          ## Security decisions

          - Real secrets are excluded from Git.
          - Kubernetes secrets use a safe example template only.
          - JWT secrets are required through environment variables instead of being hard-coded.
          - AWS access should use IAM roles where possible; long-lived access keys are not required on an EC2 instance with an attached role.
          - Trivy remains enabled in the CI/CD flow.
          - Terraform state is intended for protected S3 remote storage with S3-native locking.

          ## Prerequisites

          - AWS CLI configured through an IAM role or protected credentials
          - Terraform 1.15+
          - Docker
          - kubectl
          - Helm (for EKS add-ons where required)
          - Java 17+
          - Node.js 20+
          - Jenkins
          - MongoDB Atlas account

          ## Terraform deployment

          The Terraform environments are under `terraform/env/dev` and `terraform/env/prod`.

          Before `terraform init`, create the remote state bucket and provide its name through the backend configuration. Do not commit Terraform state or credentials.

          Example:

          ```bash
          cd terraform/env/dev
          terraform init \\
            -backend-config="bucket=<YOUR-TERRAFORM-STATE-BUCKET>"
          terraform validate
          terraform plan -var-file=terraform.tfvars
          ```

          Create your local `terraform.tfvars` from the provided example and supply only your own infrastructure values. It is ignored by Git.

          ## MongoDB Atlas

          The application expects three logical databases:

          - `users_db`
          - `products_db`
          - `orders_db`

          Store the Atlas connection strings in protected environment variables or Kubernetes Secrets. Never commit the real Atlas username/password.

          ## Jenkins

          Jenkinsfiles are provided under `jenkins/`:

          - `Jenkinsfile.infra` — Terraform plan/apply flow
          - `Jenkinsfile.backend` — backend build, image build, Trivy scan and EKS deployment
          - `Jenkinsfile.frontend` — frontend build and container delivery

          Configure credentials in Jenkins rather than hard-coding them in pipeline files.

          ## Resume-ready skills demonstrated

          **AWS | Terraform | EKS | Kubernetes | Docker | Jenkins | CI/CD | Trivy | ECR | S3 | CloudFront | Route53 | IAM | Linux | Java | Spring Boot | React | MongoDB Atlas | Infrastructure as Code**

          ## License / attribution

          See [ATTRIBUTION.md](ATTRIBUTION.md) for the source-project attribution and adaptation statement.
          EOF_README

      - name: Format and validate repository configuration
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -recursive terraform
          if grep -RInE 'mongodb\+srv://[^<[:space:]]+:[^<[:space:]]+@|AKIA[0-9A-Z]{16}|aws_secret_access_key[[:space:]]*=' \
              --exclude-dir=.git --exclude='*.lock.hcl' .; then
            echo 'Potential credential material found in repository.'
            exit 1
          fi

      - name: Remove importer workflow
        shell: bash
        run: rm -f .github/workflows/prepare.yml

      - name: Commit prepared project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: prepare medical B2B ERP DevOps portfolio project' || exit 0
          git push origin HEAD:main
